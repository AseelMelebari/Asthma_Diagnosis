<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Asthma Risk Prediction</title>
  <style>
    :root { font-family: Inter, system-ui, sans-serif; color: #172033; background: #f4f7fb; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    main { width: min(720px, 100%); background: white; border-radius: 18px; padding: 28px; box-shadow: 0 18px 55px rgba(31,45,80,.12); }
    h1 { margin: 0 0 8px; }
    .notice { padding: 12px 14px; border-radius: 10px; background: #fff4d6; margin: 18px 0; }
    form { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    label { display: grid; gap: 6px; font-weight: 600; }
    input { padding: 11px; border: 1px solid #ccd4e0; border-radius: 9px; font: inherit; }
    button { grid-column: 1 / -1; padding: 12px; border: 0; border-radius: 10px; background: #172033; color: white; font: inherit; font-weight: 700; cursor: pointer; }
    #result { margin-top: 18px; padding: 16px; border-radius: 10px; background: #eef3fa; white-space: pre-wrap; }
    .links { margin-top: 18px; display: flex; gap: 16px; }
    a { color: #2459a8; }
    @media (max-width: 600px) { form { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<main>
  <h1>Asthma Risk Prediction</h1>
  <p>Educational demo for AI ethics and governance testing.</p>
  <div class="notice"><strong>Warning:</strong> This model is not a medical device and must not be used for diagnosis or treatment.</div>
  <form id="form">
    <label>Age<input id="age" type="number" min="0" max="120" value="35" required></label>
    <label>Peak Flow<input id="peak_flow" type="number" min="0" max="1000" value="420" required></label>
    <label>Gender<input id="gender" value="Male" required></label>
    <label>Smoking Status<input id="smoking_status" value="Non-Smoker" required></label>
    <label>Medication<input id="medication" value="Inhaler" required></label>
    <button type="submit">Run prediction</button>
  </form>
  <div id="result">Result will appear here.</div>
  <div class="links"><a href="/docs">API documentation</a><a href="/model-info">Model information</a><a href="/health">Health check</a></div>
</main>
<script>
const form = document.getElementById('form');
const result = document.getElementById('result');
form.addEventListener('submit', async (event) => {
  event.preventDefault();
  result.textContent = 'Loading...';
  const payload = {
    age: Number(document.getElementById('age').value),
    gender: document.getElementById('gender').value,
    smoking_status: document.getElementById('smoking_status').value,
    medication: document.getElementById('medication').value,
    peak_flow: Number(document.getElementById('peak_flow').value)
  };
  try {
    const response = await fetch('/predict', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
    const data = await response.json();
    result.textContent = response.ok
      ? `Prediction: ${data.label}\nAsthma probability: ${data.asthma_probability == null ? 'Unavailable' : (data.asthma_probability * 100).toFixed(2) + '%'}\n\n${data.disclaimer}`
      : JSON.stringify(data, null, 2);
  } catch (error) {
    result.textContent = `Request failed: ${error}`;
  }
});
</script>
</body>
</html>
